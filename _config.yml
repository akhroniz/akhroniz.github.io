# Configuración del sitio

# Importa el tema
theme: jekyll-theme-chirpy

# Idioma de la página › http://www.lingoes.net/en/translator/langcode.htm
# Si coincide con el nombre de uno de los archivos de la carpeta `_data/locales`, el idioma de la interfaz también cambiará;
# de lo contrario, la interfaz usará el valor por defecto 'en'.
lang: es-ES

# Cambia a tu zona horaria › https://zones.arilyn.cc
timezone: America/Mexico_City

# Configuración de jekyll-seo-tag › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: HTB Fenetik # el título principal

tagline: Writeups de HTB hechos por la comunidad # se mostrará como subtítulo

description: >- # usado por las metaetiquetas SEO y el feed atom
  Espacio donde publico los writeups de Hack The Box hechos por mi comunidad.

# Escribe el protocolo y el dominio de tu sitio.
# Ej. 'https://usuario.github.io'; ten en cuenta que no termina con '/'.
url: "https://akhroniz.github.io"

github:
  username: akhroniz # tu usuario de GitHub

twitter:
  username: # tu usuario de Twitter/X (déjalo vacío si no tienes)

social:
  # Cambia a tu nombre completo.
  # Se mostrará como autor por defecto de los posts y como titular del copyright en el pie de página.
  name: akhroniz
  email: # tu correo electrónico (opcional)
  fediverse_handle: # tu usuario de fediverso. Ej. "@usuario@dominio.com"
  links:
    # El primer elemento funciona como el enlace del titular del copyright
    - https://github.com/akhroniz # tu página de GitHub
    # Descomenta las siguientes líneas para agregar más redes sociales
    # - https://twitter.com/usuario
    # - https://www.facebook.com/usuario
    # - https://www.linkedin.com/in/usuario

# Configuración de verificación del sitio
webmaster_verifications:
  google: # código de verificación de Google
  bing: # código de verificación de Bing
  alexa: # código de verificación de Alexa
  yandex: # código de verificación de Yandex
  baidu: # código de verificación de Baidu
  facebook: # código de verificación de Facebook

# ↑ --------------------------
# Fin de la configuración de `jekyll-seo-tag`

# Configuración de analítica web
analytics:
  google:
    id: # ID de Google Analytics
  goatcounter:
    id: # ID de GoatCounter
  umami:
    id: # ID de Umami
    domain: # dominio de Umami
  matomo:
    id: # ID de Matomo
    domain: # dominio de Matomo
  cloudflare:
    id: # token de Cloudflare Web Analytics
  fathom:
    id: # ID de sitio de Fathom

# Configuración de vistas de página
pageviews:
  provider: # por ahora solo admite 'goatcounter'

# Esquema de color preferido.
#
# Nota: si lo dejas vacío, seguirá por defecto el esquema de color del sistema,
# y aparecerá un botón para alternar entre tema claro y oscuro
# en la parte inferior izquierda de la barra lateral.
#
# Opciones disponibles:
#
#     light — Usa el esquema de color claro
#     dark — Usa el esquema de color oscuro
#
theme_mode: # [light | dark]

# El endpoint de CDN para los recursos multimedia.
# Ten en cuenta que, una vez asignado, la URL del CDN
# se agregará a las rutas de todos los recursos multimedia (avatar del sitio, imágenes de los posts, audio y video) que empiecen con '/'
#
# ej. 'https://cdn.com'
cdn:

# El avatar de la barra lateral; admite recursos locales o CORS
# Ej. /assets/img/avatar.png (sube la imagen a assets/img/)
avatar:

# La URL de la imagen de vista previa social de todo el sitio, usada en la metaetiqueta SEO `og:image`.
# Se puede sobrescribir con un `image` personalizado en el front matter de cada post.
social_preview_image: # texto, recursos locales o CORS

# booleano, interruptor global de la tabla de contenidos (TOC) en los posts.
toc: true

actions:
  # Muestra la acción "Editar este post" en cada página de post para fomentar contribuciones.
  edit_post:
    enabled: false # ponlo en true para mostrar la acción "Editar este post".
    url: "" # URL base del repositorio, ej. https://github.com/akhroniz/akhroniz.github.io/edit/main
    # Usa una URL dinámica o estática para el enlace de edición.
    # Si `static_url` es false, la ruta del post se agregará a la `url` anterior como enlace final de edición.
    # Ponlo en true si la URL debe permanecer sin cambios, es decir, todos los posts compartirán el mismo enlace de edición.
    static_url: false # [ true | false ]

comments:
  # Interruptor global del sistema de comentarios en los posts. Si lo dejas vacío, está desactivado.
  provider: # [disqus | utterances | giscus]
  # Las opciones de proveedor son las siguientes:
  disqus:
    shortname: # escribe el shortname de Disqus. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname
  # configuración de utterances › https://utteranc.es/
  utterances:
    repo: # <usuario-gh>/<repo>
    issue_term: # < url | pathname | title | ...>
  # Opciones de Giscus › https://giscus.app
  giscus:
    repo: # <usuario-gh>/<repo>
    repo_id:
    category:
    category_id:
    mapping: # opcional, por defecto 'pathname'
    strict: # opcional, por defecto '0'
    input_position: # opcional, por defecto 'bottom'
    lang: # opcional, por defecto el valor de `site.lang`
    reactions_enabled: # opcional, por defecto el valor de `1`

# Recursos estáticos alojados por ti mismo, opcional › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # booleano, vacío significa false
    # especifica el entorno de Jekyll, vacío significa ambos
    # solo funciona si `assets.self_host.enabled` es 'true'
    env: # [development | production]

pwa:
  enabled: true # Opción de la función PWA (instalable)
  cache:
    enabled: true # Opción de caché sin conexión de la PWA
    # Las rutas definidas aquí se excluirán de la caché de la PWA.
    # Normalmente su valor es el `baseurl` de otro sitio web que
    # comparte el mismo dominio que el sitio actual.
    deny_paths:
      # - "/example"  # las URLs que coincidan con `<URL_DEL_SITIO>/example/*` no se guardarán en la caché de la PWA

paginate: 10

# La URL base de tu sitio
baseurl: ""

# ------------ No se recomienda modificar las siguientes opciones ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Opciones de Rouge › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # Una cadena vacía aquí significa todos los archivos del proyecto
      type: posts
    values:
      layout: post
      comments: true # Activa los comentarios en los posts.
      toc: true # Muestra la columna de tabla de contenidos en los posts.
      # NO modifiques el siguiente parámetro a menos que estés seguro de poder
      # actualizar el código de todos los demás enlaces de posts de este proyecto.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # ver `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
